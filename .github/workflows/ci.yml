name: ci
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'release-manifest.json'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'release-manifest.json'
      - 'LICENSE'
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
  LASTMILE_LLM: fake
  LASTMILE_MAIL: off
  LASTMILE_ALLOW_ACTUAL: "0"
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run check:ui
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests --ignore=tests/test_adk.py --ignore-glob='*browser.py'
      - run: python -m pytest tests/test_adk.py
      - run: python scripts/live_smoke.py --llm fake
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.14", cache: pip, cache-dependency-path: requirements-e2e.txt}
      - run: python -m pip install -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - name: Use installed Chromium
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('LASTMILE_E2E_CHROMIUM=' + p.chromium.executable_path + '\n')
          PY
      - run: python -m pytest tests -k browser
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: docker build -t lastmile-response .
      - name: Start isolated exercise
        run: docker run -d --name lm -p 8080:8080 -e LASTMILE_LLM=fake -e LASTMILE_MAIL=off lastmile-response
      - name: Wait for health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/api/health; then exit 0; fi
            sleep 1
          done
          docker logs lm
          exit 1
      - name: Check packs and fictional pipeline
        run: |
          curl -fsS http://localhost:8080/api/packs > /dev/null
          python3 scripts/smoke_http.py http://localhost:8080
