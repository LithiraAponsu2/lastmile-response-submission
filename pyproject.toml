[project]
name = "lastmile-alert"
version = "0.3.0"
description = "One shared picture for disaster response in Sri Lanka: requests between organisations, acknowledged reports, area status maps and a multilingual public status page, with human-approved AI help."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = ["disaster-management", "emergency-coordination", "sri-lanka", "situational-awareness", "google-adk", "gemini"]
dependencies = [
  "pypdf==6.20.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "pyyaml>=6",
  "lxml>=5",
  "shapely>=2",
  "google-adk==1.39.1",
]

[project.urls]
Homepage = "https://github.com/LithiraAponsu2/lastmile-response-submission"
Documentation = "https://github.com/LithiraAponsu2/lastmile-response-submission/tree/main/docs"
Changelog = "https://github.com/LithiraAponsu2/lastmile-response-submission/blob/main/CHANGELOG.md"

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
cloud = ["google-cloud-storage>=3.0,<4"]
adk = ["google-adk==1.39.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["lastmile*"]

[tool.setuptools.package-data]
lastmile = ["schema/*.xsd"]
